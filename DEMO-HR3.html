    function getCurrentUser() {
      return STAFF_PROFILES[state.currentUserId] || STAFF_PROFILES['STF-001'];
    }

    function getCurrentAttendance() {
      return state.attendanceByStaff[state.currentUserId];

    }

    function rm(n) {
      return 'RM ' + Number(n).toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function getEffectiveTime() {
      const now = new Date();
      if (state.simTimeMode === 'live') {
        return {
          hours: now.getHours(),
          minutes: now.getMinutes(),
          seconds: now.getSeconds(),
          display: now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true }),
          short: now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true })
        };
      }
      const [hStr, mStr] = state.simTimeMode.split(':');
      const h = parseInt(hStr, 10);
      const m = parseInt(mStr, 10);
      const ampm = h >= 12 ? 'PM' : 'AM';
      const h12 = h % 12 || 12;
      const padH = String(h12).padStart(2, '0');
      const padM = String(m).padStart(2, '0');
      return {
        hours: h,
        minutes: m,
        seconds: 0,
        display: `${padH}:${padM}:00 ${ampm}`,
        short: `${padH}:${padM} ${ampm}`
      };
    }

    function showToast(msg, type = 'ok') {
      const box = document.getElementById('toastContainer');
      const el = document.createElement('div');
      const dot = type === 'err' ? 'bg-crimson-500' : type === 'warn' ? 'bg-gold-400' : 'bg-emerald-400';
      el.className = 'pointer-events-auto bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-xl flex items-center gap-2.5 text-xs font-semibold transition-all duration-300';
      el.innerHTML = `<span class="w-2 h-2 rounded-full ${dot} shrink-0"></span><span class="flex-1">${msg}</span>`;
      box.appendChild(el);
      setTimeout(() => {
        el.classList.add('opacity-0', '-translate-y-2');
        setTimeout(() => el.remove(), 250);
      }, 2800);
    }

    function copyToClipboard(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('Ringkasan WhatsApp berjaya disalin!');
      } catch (e) {
        showToast('Gagal menyalin ringkasan.', 'err');
      }
      document.body.removeChild(ta);
    }

      state.currentUserId = userId;

      document.getElementById('loginScreen').classList.add('hidden');
      updateHeaderProfile();
      navigate(STAFF_PROFILES[userId].role === 'admin' ? 'admin' : 'clock');
      showToast(`Log masuk berjaya: ${STAFF_PROFILES[userId].shortName} (${userId})`);

    function handlePunchButtonClick() {
      const att = getCurrentAttendance();
      const t = getEffectiveTime();
      const totalMins = t.hours * 60 + t.minutes;

      // === PUNCH OUT FLOW ===
      if (att.clockInTime && !att.clockOutTime) {
        // Strict Rule: 5:30 PM (17:30 = 1050 mins) or later = NORMAL OUT; before 5:30 PM = EARLY OUT (require reason)
        if (totalMins < 17 * 60 + 30) {
          openReasonModal('early', t.short);
        } else {
          finalizePunchOut(t.short, 'NORMAL OUT', '');
        }
        return;
      }

      // === PUNCH IN FLOW ===
      if (att.clockInTime) return;

      // GPS Geofence check
      if (state.simOutsideOffice && !att.isUrusanLuar) {
        showToast('Anda di luar radius pejabat (2.4km). Aktifkan "Urusan Luar" dahulu.', 'err');
        return;
      }

      if (att.isUrusanLuar) {
        const inp = document.getElementById('luarNoteField');
        const val = inp ? inp.value.trim() : att.luarNote.trim();
        if (!val) {
          showToast('Sila isi catatan ringkas Urusan Luar sebelum Punch In.', 'warn');
          if (inp) inp.focus();
          return;
        }
        att.luarNote = val;
      }

      // Strict Rule: <= 8:30 AM (510 mins) = ON TIME; >= 8:31 AM (511+ mins) = LATE (require reason)
      if (totalMins > 8 * 60 + 30) {
        openReasonModal('late', t.short);
      } else {
        finalizePunchIn(t.short, 'ON TIME', '');
      }
    }

    function submitReasonModal(e, type, timeShort) {
      e.preventDefault();
      const reason = document.getElementById('reasonInputField').value.trim();
      if (!reason) return;
      closeSheet();
      if (type === 'late') {
        finalizePunchIn(timeShort, 'LATE', reason);
      } else {
        finalizePunchOut(timeShort, 'EARLY OUT', reason);
      }
    }

    function finalizePunchIn(timeShort, status, lateReason) {
      const att = getCurrentAttendance();
      const u = getCurrentUser();
      att.clockInTime = timeShort;
      att.clockInStatus = status;
      att.lateReason = lateReason;
      att.mode = att.isUrusanLuar ? 'Urusan Luar' : 'In Office';
      att.clockInTs = Date.now();

      // Sync to Admin Live Board
      const row = state.teamToday.find(t => t.id === u.id);
      if (row) {
        row.time = timeShort;
        if (status === 'LATE') {
          row.status = 'Late';
          row.badgeType = 'late';
          row.note = `Lewat: ${lateReason}` + (att.isUrusanLuar ? ` • Luar: ${att.luarNote}` : '');
        } else if (att.isUrusanLuar) {
          row.status = 'Urusan Luar';
          row.badgeType = 'luar';
          row.note = att.luarNote;
        } else {
          row.status = 'In Office';
          row.badgeType = 'ok';
          row.note = 'ON TIME • Radius Pejabat (12m)';
        }
      }

      showToast(`Punch In direkodkan (${timeShort}) — ${status}`, status === 'LATE' ? 'warn' : 'ok');
      renderCurrentTab();
    }

    function finalizePunchOut(timeShort, status, earlyReason) {
      const att = getCurrentAttendance();
      const u = getCurrentUser();
      att.clockOutTime = timeShort;
      att.clockOutStatus = status;
      att.earlyReason = earlyReason;

      // Add to history top
      att.history.unshift({
        date: '27 Nov 2026 (Hari Ini)',
        inTime: att.clockInTime,
        inStatus: att.clockInStatus,
        outTime: timeShort,
        outStatus: status,
        mode: att.mode,
        note: [
          att.lateReason ? `Lewat: ${att.lateReason}` : '',
          earlyReason ? `Balik Awal: ${earlyReason}` : '',
          att.mode === 'Urusan Luar' ? `Luar: ${att.luarNote}` : 'Radius Pejabat (12m)'
        ].filter(Boolean).join(' • ')
      });

      const row = state.teamToday.find(t => t.id === u.id);
      if (row) {
        row.status = status === 'EARLY OUT' ? 'Early Out' : 'Selesai';
        row.badgeType = status === 'EARLY OUT' ? 'late' : 'done';
        row.note = `${att.clockInTime} – ${timeShort}` + (earlyReason ? ` (${earlyReason})` : '');
      }

      showToast(`Punch Out direkodkan (${timeShort}) — ${status}`, status === 'EARLY OUT' ? 'warn' : 'ok');
      renderCurrentTab();
    }

    function submitLeaveForm(e) {
      e.preventDefault();
      const u = getCurrentUser();
      const leaves = getCurrentLeaves();
      const key = document.getElementById('fLeaveType').value;
      const s = document.getElementById('fStartDate').value;
      const en = document.getElementById('fEndDate').value;
      const reason = document.getElementById('fReason').value;
      const fInput = document.getElementById('fFile');
      const file = (fInput && fInput.files && fInput.files[0]) ? fInput.files[0].name : 'Tiada';
      const days = Math.max(1, Math.floor((new Date(en) - new Date(s)) / 86400000) + 1);
      const bal = leaves.find(l => l.key === key);

      if (!bal.trackOnly && (bal.total - bal.used) < days) {
        showToast('Baki cuti tidak mencukupi!', 'err');
        return;
      }

      state.leaveRequests.unshift({
        id: 'LV-' + Math.floor(205 + Math.random() * 700),
        staffId: u.id,
        name: `${u.shortName} (${u.id})`,
        typeKey: key,
        type: bal.label,
        dates: s === en ? s : `${s} → ${en}`,
        days,
        reason,
        file,
        status: 'Pending'
      });
      updateNavBadges();
      closeSheet();
      showToast(`Permohonan ${bal.label} (${days} hari) dihantar!`);
      renderCurrentTab();
    }

      const socso = 14.75;
      const eis = 5.90;
      const net = Number((gross - epf - socso - eis).toFixed(2));
      return [
        { id: 'PS-2611', month: 'November 2026', payDate: '27 Nov 2026', basic: u.basic, allow: u.allowance, epf, socso, eis, net },
        { id: 'PS-2610', month: 'Oktober 2026', payDate: '28 Okt 2026', basic: u.basic, allow: u.allowance, epf, socso, eis, net }
      ];
    }

                <div class="w-9 h-9 rounded-xl bg-crimson-50 border border-crimson-100 flex items-center justify-center p-1.5 shrink-0">
                  <svg class="w-full h-full" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M16 10 C42 24 68 36 80 54 C86 64 88 76 86 88 C66 82 46 74 30 62 C36 62 43 63 49 64 C39 59 29 53 22 46 C19 41 17 36 17 31 C28 36 41 40 54 44 C41 37 27 30 16 24 Z" fill="#E11D2E"/>
                  </svg>
                </div>
                <div>
                  <p class="text-[10px] font-extrabold text-crimson-700 uppercase tracking-wider">Surat Tawaran Rasmi</p>
                  <h3 class="text-sm font-extrabold text-slate-900 mt-0.5">Angelus Business Consultant</h3>
                </div>
              </div>
              <span class="px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 text-[10px] font-bold">✓ Disahkan</span>
            </div>
            <div class="grid grid-cols-2 gap-2.5 text-xs bg-alabaster p-3 rounded-2xl">
              <div><p class="text-[10px] text-slate-400">Nama</p><p class="font-bold text-slate-800">${u.fullName}</p></div>
              <div><p class="text-[10px] text-slate-400">ID Staf</p><p class="font-bold text-slate-800">${u.id}</p></div>
              <div><p class="text-[10px] text-slate-400">Jawatan</p><p class="font-bold text-slate-800">${u.position}</p></div>
              <div><p class="text-[10px] text-slate-400">Pakej Bulanan</p><p class="font-bold text-emerald-700">${rm(u.basic + u.allowance)}</p></div>
            </div>
            <p class="text-[11px] text-slate-600 leading-relaxed">
              Dengan ini disahkan pelantikan rasmi kakitangan <strong>${u.fullName}</strong> bermula <strong>${u.joinDate}</strong> bersama faedah penuh KWSP, PERKESO, SIP, dan kelayakan cuti tahunan mengikut Employee Handbook syarikat.
            </p>
            <button onclick="window.print()" class="w-full py-2.5 rounded-xl bg-crimson-600 text-white text-xs font-bold cursor-pointer">
              Print / Save Offer Letter PDF
            </button>
          </div>
        `;
      }

      return `
        <div>
          <h2 class="text-base font-extrabold text-slate-900">Dokumen & Polisi HR</h2>
          <p class="text-[11px] text-slate-500">Employee Handbook, Latihan & Offer Letter</p>
        </div>
        <div class="p-1 rounded-2xl bg-slate-200/70 grid grid-cols-3 gap-1">
          <button onclick="setDocsSubTab('polisi')" class="py-2 rounded-xl text-xs font-bold transition-all cursor-pointer ${sub === 'polisi' ? 'bg-white text-crimson-700 shadow-sm' : 'text-slate-600'}">Polisi</button>
          <button onclick="setDocsSubTab('training')" class="py-2 rounded-xl text-xs font-bold transition-all cursor-pointer ${sub === 'training' ? 'bg-white text-crimson-700 shadow-sm' : 'text-slate-600'}">Training</button>
          <button onclick="setDocsSubTab('offer')" class="py-2 rounded-xl text-xs font-bold transition-all cursor-pointer ${sub === 'offer' ? 'bg-white text-crimson-700 shadow-sm' : 'text-slate-600'}">Offer Letter</button>
        </div>
        ${content}
      `;
    }

    // =========================================================================
    // TAB 5: HR ADMIN PANEL
    // =========================================================================
    function handleAdminLeaveAction(id, decision) {
      const req = state.leaveRequests.find(r => r.id === id);
      if (!req || req.status !== 'Pending') return;
      req.status = decision;
      if (decision === 'Approved') {
        const staffLeaves = state.leaveBalancesByStaff[req.staffId];
        if (staffLeaves) {
          const bal = staffLeaves.find(l => l.key === req.typeKey);
          if (bal) bal.used += req.days;
        }
      }
      updateNavBadges();
      showToast(`${req.id} ${decision === 'Approved' ? 'Diluluskan & Baki Cuti ditolak' : 'Ditolak'}!`);
      renderCurrentTab();
    }

    function copyWhatsAppSummary() {
      const text = [
        `*ANGELS_HR — LAPORAN KEHADIRAN HARIAN*`,
        `Tarikh: Jumaat, 27 Nov 2026`,
        `--------------------------------`,
        ...state.teamToday.map(t => `• *${t.name}* [${t.status}] ${t.time} — ${t.note}`),
        `--------------------------------`
      ].join('\n');
      copyToClipboard(text);
    }

    function exportAttendanceCSV() {
      const rows = [
        ['ID', 'Nama', 'Bahagian', 'Status', 'Masa Masuk', 'Catatan'],
        ...state.teamToday.map(t => [t.id, `"${t.fullName}"`, t.role, t.status, t.time, `"${t.note}"`])
      ];
      const uri = 'data:text/csv;charset=utf-8,' + rows.map(r => r.join(',')).join('\n');
      const a = document.createElement('a');
      a.href = encodeURI(uri);
      a.download = 'ANGELS_HR_Daily_27Nov2026.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast('Fail CSV kehadiran berjaya dimuat turun!');
    }

    function renderAdminTab() {
      const pendingList = state.leaveRequests.filter(r => r.status === 'Pending');
      return `
        <div class="flex items-center justify-between">
          <div>
            <h2 class="text-base font-extrabold text-slate-900">Panel HR Admin</h2>
            <p class="text-[11px] text-slate-500">Siapa di pejabat, kelulusan cuti & laporan</p>
          </div>
          <span class="px-2.5 py-1 rounded-full bg-gold-100 border border-gold-500/30 text-gold-600 text-[10px] font-extrabold">LIVE</span>
        </div>

        <!-- One-Click Daily Report Actions -->
        <div class="grid grid-cols-2 gap-2.5">
          <button onclick="copyWhatsAppSummary()" class="py-3 px-3 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow-sm flex items-center justify-center gap-1.5 cursor-pointer">
            <i data-lucide="copy" class="w-3.5 h-3.5"></i>
            <span>Copy WhatsApp</span>
          </button>
          <button onclick="exportAttendanceCSV()" class="py-3 px-3 rounded-2xl bg-white hover:bg-slate-50 border border-slate-200 text-slate-800 text-xs font-bold shadow-sm flex items-center justify-center gap-1.5 cursor-pointer">
            <i data-lucide="download" class="w-3.5 h-3.5"></i>
            <span>Export CSV</span>
          </button>
        </div>

        <!-- Pending Leave Approvals -->
        <div class="bg-white rounded-3xl p-4 shadow-sm border border-slate-200/70 space-y-3">
          <div class="flex items-center justify-between">
            <h3 class="text-xs font-extrabold text-slate-800 uppercase tracking-wider">Kelulusan Cuti (${pendingList.length})</h3>
            <span class="text-[10px] text-slate-400">Tolak baki automatik</span>
          </div>
          ${pendingList.length === 0 ? `<p class="text-xs text-slate-400 text-center py-3">Tiada permohonan menunggu kelulusan.</p>` : `
            <div class="space-y-2.5">
              ${pendingList.map(r => `
                <div class="p-3.5 rounded-2xl bg-alabaster border border-slate-200/70 space-y-2.5">
                  <div>
                    <p class="text-xs font-extrabold text-slate-900">${r.name}</p>
                    <p class="text-[11px] font-semibold text-crimson-700">${r.type} • ${r.days} hari (${r.dates})</p>
                    <p class="text-[10px] text-slate-500 mt-0.5">${r.reason}</p>
                  </div>
                  <div class="grid grid-cols-2 gap-2">
                    <button onclick="handleAdminLeaveAction('${r.id}', 'Approved')" class="py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold cursor-pointer">Approve</button>
                    <button onclick="handleAdminLeaveAction('${r.id}', 'Rejected')" class="py-2 rounded-xl bg-crimson-50 hover:bg-crimson-100 text-crimson-700 text-xs font-bold cursor-pointer">Reject</button>
                  </div>
                </div>
              `).join('')}
            </div>
          `}
        </div>

        <!-- Live Office Presence Board -->
        <div class="bg-white rounded-3xl p-4 shadow-sm border border-slate-200/70 space-y-3">
          <h3 class="text-xs font-extrabold text-slate-800 uppercase tracking-wider">Siapa di Pejabat Hari Ini</h3>
          <div class="space-y-2">
            ${state.teamToday.map(t => {
              const badge = t.badgeType === 'ok'
                ? 'bg-emerald-50 text-emerald-700'
                : t.badgeType === 'luar'
                ? 'bg-sky-50 text-sky-700'
                : t.badgeType === 'late'
                ? 'bg-crimson-50 text-crimson-700'
                : t.badgeType === 'done'
                ? 'bg-slate-100 text-slate-700'
                : 'bg-amber-50 text-amber-700';
              return `
                <div class="p-3 rounded-2xl bg-alabaster flex items-center justify-between gap-2">
                  <div class="flex items-center gap-2.5 min-w-0">
                    <div class="w-8 h-8 rounded-xl ${t.color} text-white text-[10px] font-extrabold flex items-center justify-center shrink-0">${t.init}</div>
                    <div class="min-w-0">
                      <p class="text-xs font-bold text-slate-800 truncate">${t.name} <span class="text-slate-400 font-normal">(${t.id})</span></p>
                      <p class="text-[10px] text-slate-500 truncate">${t.note}</p>
                    </div>
                  </div>
                  <div class="text-right shrink-0">
                    <span class="px-2 py-0.5 rounded-md text-[10px] font-bold ${badge}">${t.status}</span>
                    <p class="text-[10px] font-semibold text-slate-400 mt-0.5">${t.time}</p>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // RENDER & LIVE CLOCK TICKER
    // =========================================================================
    function renderCurrentTab() {
      const main = document.getElementById('mainContent');
      switch (state.activeTab) {
        case 'clock': main.innerHTML = renderClockTab(); break;
        case 'leave': main.innerHTML = renderLeaveTab(); break;
        case 'payslip': main.innerHTML = renderPayslipTab(); break;
        case 'docs': main.innerHTML = renderDocsTab(); break;
        case 'admin': main.innerHTML = renderAdminTab(); break;
      }
      lucide.createIcons();
    }

    function tickClock() {
      const t = getEffectiveTime();
      const el = document.getElementById('liveClockDisplay');
      if (el) el.textContent = t.display;

      const att = getCurrentAttendance();
      if (att && att.clockInTs && !att.clockOutTime) {
        const diff = Math.max(1, Math.floor((Date.now() - att.clockInTs) / 1000));
        const h = Math.floor(diff / 3600);
        const m = Math.floor((diff % 3600) / 60);
        att.workDurationStr = `${h}j ${String(m).padStart(2, '0')}m`;
        const lbl = document.getElementById('liveTimerLabel');
        if (lbl) lbl.textContent = `Sedang Bekerja • ${att.workDurationStr}`;
        const durEl = document.getElementById('summaryDurText');
        if (durEl) durEl.textContent = att.workDurationStr;
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved && STAFF_PROFILES[saved]) {
          state.currentUserId = saved;
        }
      } catch (e) {}
      updateHeaderProfile();
      updateNavBadges();
      navigate('clock');
      setInterval(tickClock, 1000);
    });
  </script>
</body>
</html>
